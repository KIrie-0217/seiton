# Fallback profile for any camera following the DCF layout (DCIM/NNNXXXXX).
# Used when no other profile matches. See docs/architecture.md §6.
schema_version = 1
id = "generic-dcf"
name = "Generic (DCF)"

[match]
fallback = true

[layout]
scan_roots = ["DCIM/*"]
ignore = []

[kinds]
raw = ["CR3", "CR2", "CRW", "NEF", "NRW", "ARW", "SR2", "RAF", "ORF", "RW2", "PEF", "SRW", "DNG"]
heif = ["HIF", "HEIC", "HEIF"]
jpeg = ["JPG", "JPEG"]
video = ["MP4", "MOV", "MTS", "M2TS", "AVI"]
sidecar = ["XMP"]

[metadata]
rating_tags = ["XMP:Rating", "EXIF:Rating"]
