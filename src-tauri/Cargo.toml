[package]
name = "seiton-app"
description = "seiton desktop application (Tauri shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "seiton_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "seiton"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
seiton-core = { workspace = true, features = ["ts"] }
seiton-device-api = { workspace = true }
seiton-device-fs = { workspace = true }
seiton-profiles = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
